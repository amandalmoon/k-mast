[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kmast"
version = "1.2.0"
description = "K-MAST KM-000 offline contracts; LIVE disabled"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915", "build==1.3.0"]

[project.scripts]
kmast = "kmast.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

