name: K-MAST offline data contracts
on: [push, pull_request]
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -q --junitxml=artifacts/junit.xml
      - run: python -m build --no-isolation
      - run: python -m kmast.demo
      - run: python -m kmast.data.cli fixture --output artifacts/km001-ci-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: artifacts/
