name: K-MAST offline data contracts
on: [push, pull_request]
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -q --junitxml=artifacts/junit.xml
      - run: python -m build --no-isolation
      - run: python -m kmast.demo
      - run: python -m kmast.data.cli fixture --output artifacts/km001-ci-fixture
      - run: python -m kmast.execution.demo --output artifacts/km002-ci-scenarios
      - run: python scripts/check_km002_evidence.py artifacts/km002-ci-scenarios
      - run: python -m kmast.simulation.cli --output artifacts/km003-ci-functional
      - run: python scripts/check_km003_evidence.py artifacts/km003-ci-functional
      - run: python -m kmast.portfolio.demo --output artifacts/km004-ci-joint
      - run: python -m kmast.portfolio.demo --output artifacts/km004-ci-joint
      - run: python -m kmast.research.cli --output artifacts/km005-ci-no-data
      - run: python scripts/check_km005_evidence.py --report artifacts/km005-ci-no-data/qualification.json
      - run: python scripts/check_data_first_evidence.py
      - run: python scripts/check_df002_evidence.py
      - run: python scripts/check_df003_evidence.py
      - run: python scripts/check_df004_evidence.py
      - run: python scripts/check_df005_evidence.py
      - run: python scripts/check_df006_evidence.py
      - run: python scripts/check_df007_evidence.py
      - run: python scripts/check_df008_evidence.py
      - run: python scripts/check_df009_evidence.py
      - run: python scripts/check_df009r1_evidence.py
      - run: python scripts/check_df010_evidence.py
      - run: python scripts/check_df011_evidence.py
      - run: python scripts/check_df012_evidence.py
      - run: python scripts/check_df013_evidence.py
      - run: python scripts/check_df014_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: artifacts/
